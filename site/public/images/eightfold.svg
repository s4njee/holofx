<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Eightfold Path diorama">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a3a"/>
      <stop offset="1" stop-color="#20281f"/>
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e8b04b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="470" cy="250" r="220" fill="url(#lantern)" opacity=".7"/>
  <!-- isometric tiles -->
  <g stroke="#4b5a45" stroke-width="1">
    <polygon points="400,360 520,420 400,480 280,420" fill="url(#tile)"/>
    <polygon points="520,420 640,480 520,540 400,480" fill="#1a211a"/>
    <polygon points="280,420 400,480 400,540 280,480" fill="#161c16"/>
  </g>
  <!-- sprite -->
  <g fill="#e8b04b">
    <rect x="388" y="318" width="24" height="10"/>
    <rect x="386" y="328" width="28" height="24" fill="#c98f36"/>
    <rect x="384" y="352" width="8" height="14"/>
    <rect x="408" y="352" width="8" height="14"/>
  </g>
  <!-- eightfold tally -->
  <g stroke="#8f9a86" stroke-width="3" opacity=".55">
    <line x1="150" y1="150" x2="150" y2="200"/>
    <line x1="166" y1="150" x2="166" y2="200"/>
    <line x1="182" y1="150" x2="182" y2="200"/>
    <line x1="198" y1="150" x2="198" y2="200"/>
    <line x1="140" y1="162" x2="208" y2="188"/>
    <line x1="150" y1="210" x2="150" y2="260"/>
    <line x1="166" y1="210" x2="166" y2="260"/>
    <line x1="182" y1="210" x2="182" y2="260"/>
    <line x1="198" y1="210" x2="198" y2="260"/>
    <line x1="140" y1="222" x2="208" y2="248"/>
  </g>
</svg>
