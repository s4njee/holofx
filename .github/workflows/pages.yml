name: Deploy site

# Deploy the site to GitHub Pages (M5 story 5.2). The repo is served at /holofx/, so the whole
# build runs with SITE_BASE set and the labs are built under the same prefix.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      # ffmpeg generates the 1200×630 Open Graph card for each effect (story 5.10).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Install every project and the site, then build the libraries, labs, catalogue and site.
      - run: npm run bootstrap
      - run: npm run build
        env:
          SITE_BASE: /holofx/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
